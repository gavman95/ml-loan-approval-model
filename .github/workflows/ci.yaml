name: My Github CI Workflow
on:
  push: 
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    env:
      ENVIRONMENT: "test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with: 
          enable-cache: true
      
      - name: Install curl-config
        run: | 
          sudo apt-get update
          sudo apt install libcurl4-openssl-dev libssl-dev

      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Lint code
        run: uv run ruff check . 

      - name: Type checker
        run: uv run mypy
      
      - name: Run tests
        run: uv run pytest