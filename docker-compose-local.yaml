
services:

  # ----------------------
  # 🪣 MinIO (S3 storage)
  # ----------------------
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ----------------------
  # ⚡ FastAPI
  # ----------------------
  loan-api-local:
    image: mlopsbootcamp-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan_api_local
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./constants:/app/constants
    environment:
      ENV_MODE: local
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - minio
    command: >
      uvicorn src.fast_app.fast_app:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ----------------------
  # 🎨 Streamlit frontend
  # ----------------------
  loan-frontend-local:
    image: mlopsbootcamp-app
    container_name: loan_frontend_local
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./constants:/app/constants
    environment:
      BACKEND_API_URL: http://loan-api-local:8000/predict
    depends_on:
      - loan-api-local
    command: >
      uv run streamlit run src/streamlit_app/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0

# ----------------------
# 💾 Volumes
# ----------------------
volumes:
  minio_data: